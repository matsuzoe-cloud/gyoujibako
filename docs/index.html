<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ぎょうじばこ</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ぎょうじばこ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --bg2:#f7f7f7; --ink:#2f3438; --sub:#8f969c; --line:#e9e9e9;
    --accent:#e26e88; --accent-bg:#fdf0f3; --blue:#4a90d9; --green:#3fa878;
    --shu:#d64545; --danger:#d9534f;
  }
  *{margin:0;padding:0;box-sizing:border-box;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  html,body{background:#ececec;}
  body{color:var(--ink);font-size:15px;}
  button{cursor:pointer;border:none;font-family:inherit;color:inherit;background:none;font-size:inherit;}

  .phone{max-width:430px;margin:0 auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;position:relative;}
  .screen{flex:1;padding-bottom:110px;}

  /* ---- app bar ---- */
  .bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);
    display:flex;align-items:center;height:52px;padding:0 8px;}
  .bar .backb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink);}
  .bar .title{flex:1;text-align:center;font-size:16px;font-weight:700;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar .side{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sub);font-weight:700;}
  .bar .gearb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#8a8a8a;}
  .bar .gearb svg{width:22px;height:22px;}

  /* ---- sections & rows ---- */
  .slabel{font-size:12px;font-weight:700;color:var(--sub);padding:20px 16px 8px;}
  .rows{background:#fff;}
  .row{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:13px 16px;
    border-bottom:1px solid var(--line);text-align:left;background:#fff;font-size:16px;}
  .row:active{background:var(--bg2);}
  .row .ic{width:36px;height:36px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;}
  .row .ic svg{width:24px;height:24px;display:block;}
  .nextev .ic svg{width:26px;height:26px;display:block;}
  .row .txt{flex:1;line-height:1.5;}
  .row .sub{display:block;font-size:12px;color:var(--sub);margin-top:2px;}
  .row .side{font-size:13px;color:var(--sub);flex:none;}
  .row .chev{color:#c8c8c8;font-size:17px;flex:none;font-family:sans-serif;}
  .row.sel{color:var(--accent);}
  .row .check{color:var(--accent);font-weight:700;flex:none;}

  /* ---- forms ---- */
  .formwrap{padding:4px 16px;}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:18px 0 2px;}
  input[type=date],input[type=text],textarea{width:100%;padding:12px 0;border:none;border-bottom:1px solid var(--line);
    border-radius:0;font-size:16px;font-family:inherit;background:transparent;color:var(--ink);}
  textarea{min-height:72px;line-height:1.7;resize:none;}
  input:focus,textarea:focus{outline:none;border-bottom-color:var(--accent);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .chip{padding:9px 14px;border-radius:8px;background:var(--bg2);font-size:14px;color:#666;border:1px solid transparent;}
  .chip.sel{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);font-weight:700;}

  /* ---- buttons ---- */
  .ctabar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:10;
    background:rgba(255,255,255,.97);border-top:1px solid var(--line);
    padding:10px 16px calc(12px + env(safe-area-inset-bottom));}
  .btn-p{display:block;width:100%;padding:13px;border-radius:8px;background:var(--accent);color:#fff;
    font-size:15px;font-weight:700;text-align:center;}
  .btn-p:disabled{background:#d8d8d8;}
  .btn-p:active{opacity:.85;}
  .btn-o{display:block;width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#fff;
    font-size:15px;font-weight:700;text-align:center;color:var(--ink);margin-top:8px;}

  .homehero{padding:18px 16px 6px;}

  /* ---- つぎの行事（ルナルナ型カウントダウン） ---- */
  .nextev{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff;}
  .nextev .nm{font-size:16px;font-weight:700;}
  .nextev .dt{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;}
  .nextev .cnt{margin-left:auto;flex:none;display:flex;align-items:baseline;gap:2px;}
  .nextev .cnt .n{font-size:22px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;}
  .nextev .cnt .a{font-size:12px;color:var(--sub);font-weight:700;}

  /* ---- progress (数字ドット。保育士バンク型) ---- */
  .stepdots{display:flex;gap:5px;align-items:center;}
  .stepdots .sd{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .stepdots .sd.done{background:#f2c0cb;}
  .stepdots .sd.on{background:var(--accent);}

  /* ---- マスコット「ばこ」 ---- */
  .mascot{animation:bob 1.7s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .emptyhome{text-align:center;padding:34px 16px 6px;}
  .emptyhome .m{font-size:13px;color:var(--sub);margin-top:12px;line-height:1.9;}

  /* ---- loading ---- */
  .loading{display:flex;flex-direction:column;align-items:center;padding:90px 30px;gap:20px;}
  .spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading .msg{font-size:14px;color:var(--sub);text-align:center;line-height:2;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---- result ---- */
  .paper{margin:0 16px;background:#fff;border:1px solid var(--line);border-radius:4px;padding:22px 18px;
    line-height:2;font-size:14px;white-space:pre-wrap;box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .editnote{font-size:12px;color:var(--sub);padding:8px 16px 0;}
  .checkrow{display:flex;gap:8px;padding:9px 16px;font-size:14px;line-height:1.6;color:#555;}
  .checkrow .m{flex:none;color:var(--accent);font-weight:700;}
  .checkrow.ng{color:var(--danger);} .checkrow.ng .m{color:var(--danger);}

  /* ---- poster (印刷物の中だけ にぎやか) ---- */
  .posterbox{padding:0 16px;}
  .poster{width:100%;aspect-ratio:210/297;border-radius:4px;overflow:hidden;position:relative;
    box-shadow:0 1px 6px rgba(0,0,0,.12);border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;text-align:center;}
  .poster *{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;}
  .poster .garland{position:absolute;top:0;left:0;right:0;}
  .poster .confetti{position:absolute;border-radius:50%;opacity:.5;}
  .poster .body{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%;padding:14% 9% 16%;}
  .poster .p-emoji{font-size:42px;}
  .poster .p-icon svg{width:64px;height:64px;filter:drop-shadow(0 2px 0 rgba(255,255,255,.5));}
  .loadbubble{width:124px;height:124px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;}
  .donehead{position:relative;}
  .dcf{position:absolute;border-radius:50%;opacity:.75;}
  .poster h3{font-size:34px;font-weight:900;line-height:1.25;letter-spacing:2px;margin-top:6px;}
  .poster .p-datebox{margin-top:14px;background:rgba(255,255,255,.92);border-radius:14px;padding:9px 20px;box-shadow:0 3px 8px rgba(0,0,0,.08);}
  .poster .p-date{font-size:16px;font-weight:900;}
  .poster .p-time{font-size:12px;font-weight:700;color:#8a8078;}
  .poster .p-place{margin-top:9px;font-size:12px;font-weight:700;background:rgba(255,255,255,.75);padding:4px 14px;border-radius:999px;}
  .poster .p-garden{position:absolute;bottom:4.5%;left:50%;transform:translateX(-50%);z-index:2;
    font-size:11px;font-weight:900;background:rgba(255,255,255,.9);padding:5px 16px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.08);white-space:nowrap;}
  .photo-strip{position:relative;z-index:2;display:flex;justify-content:center;gap:12px;padding-top:12%;}
  .polaroid{width:60px;height:70px;background:#fff;border-radius:4px;box-shadow:0 3px 8px rgba(0,0,0,.14);
    padding:4px 4px 12px;}
  .polaroid .ph{width:100%;height:100%;background:#f1e8dc;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:20px;}
  .polaroid:nth-child(1){transform:rotate(-4deg);} .polaroid:nth-child(2){transform:rotate(3deg);} .polaroid:nth-child(3){transform:rotate(-2deg);}

  /* ---- sheet ---- */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:430px;background:#fff;border-radius:14px 14px 0 0;
    padding:6px 0 calc(18px + env(safe-area-inset-bottom));animation:sheetUp .22s ease-out both;}
  @keyframes sheetUp{from{transform:translateY(40%)}to{transform:none}}
  .sheet .grab{width:36px;height:4px;border-radius:2px;background:#ddd;margin:8px auto 6px;}
  .sheet .sh{font-weight:700;font-size:15px;padding:8px 16px 6px;}

  /* ---- principal ---- */
  .p-note{background:#fff8e1;color:#7a6520;font-size:13px;font-weight:700;padding:10px 16px;border-bottom:1px solid #f0e6c8;}
  .twin{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;}
  .okbtn{padding:15px;border-radius:10px;font-size:16px;font-weight:700;color:#fff;background:var(--green);}
  .fixbtn{padding:15px;border-radius:10px;font-size:16px;font-weight:700;background:#fff;border:1px solid var(--line);}
  .bigtext .paper{font-size:16px;line-height:2.1;}

  /* ---- done ---- */
  .donehead{text-align:center;padding:30px 16px 6px;}
  .donehead .mark{width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;font-size:28px;
    display:flex;align-items:center;justify-content:center;margin:0 auto;animation:pop .4s ease both;}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .donehead .t{font-size:17px;font-weight:700;margin-top:12px;}
  .donehead .time{font-size:13px;color:var(--sub);margin-top:4px;}
  /* ---- はんこ（承認の言葉） ---- */
  .stamp{display:inline-flex;align-items:center;justify-content:center;flex:none;
    border:2px solid var(--shu);color:var(--shu);border-radius:50%;font-weight:700;
    transform:rotate(-8deg);background:rgba(255,255,255,.85);}
  .stamp-sm{width:28px;height:28px;font-size:13px;}
  .stamp-md{width:52px;height:52px;font-size:21px;border-width:2.5px;}
  .stamp-lg{width:88px;height:88px;font-size:34px;border-width:3px;}
  .stamped{animation:stampin .3s cubic-bezier(.2,1.5,.4,1) both;}
  @keyframes stampin{from{transform:rotate(-24deg) scale(1.9);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
  .paperwrap{position:relative;}
  .paperwrap .stamp-md{position:absolute;top:12px;right:26px;z-index:2;}
  .stampbtn{width:96px;height:96px;border-radius:50%;border:3px solid var(--shu);color:var(--shu);
    background:#fff;font-size:36px;font-weight:700;display:flex;align-items:center;justify-content:center;
    transform:rotate(-8deg);box-shadow:0 2px 8px rgba(214,69,69,.18);margin:0 auto;}
  .stampbtn:active{transform:rotate(-8deg) scale(.9);}
  .stampcap{text-align:center;font-size:13px;color:var(--sub);margin-top:10px;}

  .npbox{margin:8px 16px 0;border:1px dashed #b9cfe4;border-radius:8px;padding:14px;text-align:center;}
  .npbox .code{font-size:24px;font-weight:700;letter-spacing:3px;color:var(--blue);font-variant-numeric:tabular-nums;}
  .npbox .l{font-size:12px;color:var(--sub);}

  .foot{margin-top:36px;padding:0 16px 20px;font-size:12px;line-height:2;color:#b5b5b5;text-align:center;}

  /* ---- アプリロック ---- */
  .lockwrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:80px 20px;}
  .lockt{font-weight:700;}
  .lockerr{color:var(--danger);font-size:13px;font-weight:700;}
  .lockwrap input{text-align:center;font-size:22px;letter-spacing:6px;max-width:220px;}
  .lockwrap .btn-p{max-width:220px;width:100%;}

  /* ---- PC・タブレット ---- */
  @media(min-width:880px){
    .phone{max-width:860px;}
    .resultgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0 28px;align-items:start;padding-right:16px;}
    .resultgrid .colR{position:sticky;top:64px;}
    .ctabar .btn-p{max-width:420px;margin:0 auto;}
  }

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(51,51,51,.92);color:#fff;
    padding:11px 20px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;white-space:nowrap;}
  .toast.show{opacity:1;}

  @media print{
    body *{visibility:hidden;} #printArea,#printArea *{visibility:visible;}
    #printArea{position:absolute;inset:0;display:block;}
    #printArea .poster{box-shadow:none;border:none;border-radius:0;height:100vh;}
    #printArea .paper{box-shadow:none;border:none;font-size:16px;margin:0;}
    .stamp{display:none;}
  }
  #printArea{display:none;}
</style>
</head>
<body>
<div class="phone" id="phone"></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* ============ data ============ */
const EV = {
  undoukai:{name:"運動会", emoji:"🏃", accent:"#f2762e", soft:"#eaf4fc",
    bg:"linear-gradient(165deg,#aee1ff 0%,#e8f6ff 45%,#fff3c4 100%)", flags:["#f2762e","#6fa8dc","#f2b84b","#4fb586"], conf:["#f2762e","#6fa8dc","#f2b84b"]},
  natsumatsuri:{name:"夏祭り", emoji:"🏮", accent:"#e05c6e", soft:"#fdeef0",
    bg:"linear-gradient(165deg,#2c3e6b 0%,#7c5ba6 55%,#ff9d76 100%)", flags:["#ffd66e","#ff8fab","#7fd8be","#ffb347"], conf:["#ffd66e","#ff8fab","#ffffff"]},
  happyoukai:{name:"発表会", emoji:"🎭", accent:"#8e6fd8", soft:"#f3effc",
    bg:"linear-gradient(165deg,#e8e0ff 0%,#f6efff 50%,#ffe9f2 100%)", flags:["#8e6fd8","#f76e92","#f2b84b","#6fa8dc"], conf:["#8e6fd8","#f76e92","#f2b84b"]},
  sotsuen:{name:"卒園式", emoji:"🌸", accent:"#e0699a", soft:"#fdf0f5",
    bg:"linear-gradient(165deg,#ffe9f0 0%,#fff6f0 55%,#e7f6ea 100%)", flags:["#e0699a","#f2b84b","#7fd8be","#f76e92"], conf:["#f9c8d8","#e0699a","#7fd8be"]}
};
const MOODS = {
  attaka:{label:"あたたかく", ex:"成長した姿を、楽しみにいらしてください"},
  teinei:{label:"きちんと", ex:"ぜひお越しくださいますよう、お願いいたします"},
  wakuwaku:{label:"わくわく", ex:"当日は、いっしょに楽しんでください！"}
};
const TIMES = ["9:00","9:30","10:00","15:30","16:00"];

let S = null;
function load(){ try{ const d=JSON.parse(localStorage.getItem("gyoujibako2")); if(d&&d.garden!==undefined) return d; }catch(e){}
  return {garden:"", classes:"", ng:"必ず,絶対,がんばれ", principle:"", events:[], seq:1, wip:null, materials:{}}; }

/* ---- 暗号化保存(アプリロック)。鍵はロック番号から導出。端末の外には何も出ない ---- */
const ENC_KEY="gyoujibako2enc", PLAIN_KEY="gyoujibako2";
let cryptoKey=null, encSalt=null;
function b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function unb64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function deriveKey(pin, saltBytes){
  const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:saltBytes, iterations:150000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]); }
async function saveEncrypted(){
  try{
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, cryptoKey, new TextEncoder().encode(JSON.stringify(S)));
    localStorage.setItem(ENC_KEY, JSON.stringify({salt:encSalt, iv:b64(iv), ct:b64(ct)}));
  }catch(e){ toast("保存できませんでした"); } }
function save(){ if(cryptoKey){ saveEncrypted(); } else localStorage.setItem(PLAIN_KEY, JSON.stringify(S)); }
async function enableLock(pin){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  encSalt=b64(salt); cryptoKey=await deriveKey(pin, salt);
  await saveEncrypted(); localStorage.removeItem(PLAIN_KEY); }
async function disableLock(){ cryptoKey=null; encSalt=null; localStorage.removeItem(ENC_KEY); save(); }
async function unlock(pin){
  try{
    const blob=JSON.parse(localStorage.getItem(ENC_KEY));
    const key=await deriveKey(pin, unb64(blob.salt));
    const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(blob.iv)}, key, unb64(blob.ct));
    S=JSON.parse(new TextDecoder().decode(pt));
    cryptoKey=key; encSalt=blob.salt; return true;
  }catch(e){ return false; } }

/* ---- 5分さわらないと自動ロック ---- */
let idleTimer=null;
function armIdle(){ if(!cryptoKey) return; clearTimeout(idleTimer); idleTimer=setTimeout(()=>location.reload(), 5*60*1000); }
["click","keydown","input","touchstart"].forEach(ev=>document.addEventListener(ev, armIdle, {passive:true}));

function lockScreen(msg){
  P.innerHTML=`${bar({title:"ぎょうじばこ"})}
  <div class="screen"><div class="lockwrap">
    ${bako(76)}
    <div class="lockt">ロックがかかっています</div>
    <input type="password" id="pin" inputmode="numeric" maxlength="8" placeholder="ロック番号" autocomplete="off">
    <button class="btn-p" onclick="tryUnlock()">あける</button>
    ${msg?`<div class="lockerr">${msg}</div>`:""}
  </div></div>`;
  const el=document.getElementById("pin"); el.focus();
  el.addEventListener("keydown",e=>{ if(e.key==="Enter") tryUnlock(); }); }
async function tryUnlock(){
  const ok=await unlock(document.getElementById("pin").value.trim());
  if(ok){ armIdle(); home(); } else lockScreen("番号がちがいます"); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function jpDate(iso){ if(!iso)return ""; const dt=new Date(iso+"T00:00:00");
  return `${dt.getMonth()+1}月${dt.getDate()}日（${"日月火水木金土"[dt.getDay()]}）`; }

let cur=null, startedAt=null;
const P=document.getElementById("phone");
const GEAR=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5c.04-.5.04-2.5 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2h-4l-.4 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.4-1-2 3.4 2 1.6c-.04.5-.04 2.5 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5L10 22h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg>`;

/* ============ nav ============ */
/* 行事ピクトグラム(描き起こし)。絵文字をアイコンに使わない */
function evIcon(k){
  const s = {
  undoukai:`<path d="M3 9 Q18 15 33 9" stroke="#b98d4e" stroke-width="2" fill="none"/>

function checks(){
  const out=[];
  out.push({ok:true, label:`${jpDate(cur.date)}。曜日は合っています`});
  const ngs=(S.ng||"").split(",").map(s=>s.trim()).filter(Boolean);
  const hit=ngs.filter(w=>cur.letter.includes(w));
  out.push(hit.length? {ok:false,label:`「${hit.join("、")}」が入っています。園では使わない言葉です`}
                     : {ok:true, label:`園で使わない言葉は入っていません`});
  out.push({ok:cur.letter.includes(cur.place), label: cur.letter.includes(cur.place)?"場所の書きもれはありません":"場所が書かれていません"});
  const n=matCount(cur.type);
  if(n) out.push({ok:true, label:`去年の資料 ${n}枚をもとにしています`});
  out.push({ok:true, label:"写真は外部に送っていません"});
  return out;
}

function garlandSvg(colors){
  const flags=Array.from({length:9},(_,i)=>{
    const x=i*46+8, c=colors[i%colors.length];

  return `<svg class="garland" viewBox="0 0 430 52" preserveAspectRatio="none">
    <path d="M0 10 Q215 26 430 10" stroke="rgba(255,255,255,.85)" stroke-width="3" fill="none"/>${flags}</svg>`;
}
function confettiDots(colors){
  const pos=[["12%","22%"],["85%","18%"],["8%","62%"],["90%","58%"],["16%","82%"],["82%","80%"],["50%","14%"]];
  return pos.map(([l,t],i)=>`<div class="confetti" style="left:${l};top:${t};width:${7+(i%3)*3}px;height:${7+(i%3)*3}px;background:${colors[i%colors.length]}"></div>`).join("");

    <input type="text" id="s_garden" value="${esc(S.garden)}" placeholder="ひまわり保育園">
    <label class="f">クラスの名前（・でくぎる）</label>
    <input type="text" id="s_classes" value="${esc(S.classes)}" placeholder="ひよこ・りす・ぱんだ">
    <label class="f">おたよりで使わない言葉（,でくぎる）</label>
    <input type="text" id="s_ng" value="${esc(S.ng)}">
    <label class="f">園で大切にしていること</label>
    <textarea id="s_principle" placeholder="のびのびと、じぶんらしく。">${esc(S.principle)}</textarea>
  </div>
  <div class="slabel" style="padding-top:26px">去年の資料</div>
  <div class="rows">
    <button class="row" onclick="go('materials')">
      <span class="txt">去年のおたより・ポスター<span class="sub">写真に撮って入れておくと、下書きのもとになります</span></span>
      <span class="side">${matTotal()?matTotal()+"枚":"なし"}</span><span class="chev">›</span></button>
  </div>
  <div class="slabel" style="padding-top:26px">アプリロック</div>
  ${cryptoKey?`<div class="rows"><button class="row" onclick="doDisableLock()">
      <span class="txt">ロックを解除する<span class="sub">暗号化をやめて、この端末にそのまま保存します</span></span><span class="chev">›</span></button></div>`
  :`<div class="formwrap"><label class="f">ロック番号（4〜8桁の数字）</label>
    <input type="password" id="s_pin" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="共用のパソコンで使うなら設定を">
    <div style="padding:12px 0 0"><button class="btn-o" onclick="doEnableLock()">ロックをかける（中身を暗号化して保存）</button></div>
    <div style="font-size:12px;color:var(--sub);padding-top:8px;line-height:1.9">開くたびに番号が必要になります。5分さわらないと自動でロックされます。<br>⚠ 番号を忘れると中身は開けません。</div></div>`}
  <div style="padding:20px 16px 0"><button class="btn-o" onclick="fillSample()">おためしデータを入れる</button></div>
  <div class="foot">とちゅうで呼ばれても、つづきから再開できます<br>
    お子さんの写真を外部に送ることはありません<br>
    保育士資格を持つ開発者が作っています</div>
  </div>
  <div class="ctabar"><button class="btn-p" onclick="saveSettings()">保存</button></div>`;
}

/* ============ 去年の資料 ============ */
function materials(){
  P.innerHTML=`${bar({back:"settings()", title:"去年の資料"})}
  <div class="screen">
    <div class="slabel">去年のおたよりやポスターを、写真に撮って入れておく場所です。ここに入れたものをもとに、今年の下書きを作ります。写真は この端末の中にだけ保存されます。</div>
    ${Object.entries(EV).map(([k,d])=>{
      const list=(S.materials||{})[k]||[];
      return `<div class="slabel">${d.emoji} ${d.name}</div>
      <div class="rows">
        ${list.map((m,i)=>`<div class="row">
          <img src="${m}" style="width:44px;height:44px;object-fit:cover;border-radius:6px;flex:none">
          <span class="txt">去年の${d.name} ${i+1}</span>
          <button class="side" style="color:var(--danger)" onclick="delMat('${k}',${i})">削除</button></div>`).join("")}
        <button class="row" onclick="document.getElementById('mat_${k}').click()">
          <span class="ic" style="color:var(--accent)">＋</span><span class="txt" style="color:var(--accent)">写真を追加</span></button>
        <input type="file" id="mat_${k}" accept="image/*" style="display:none" onchange="addMat('${k}',this)">
      </div>`;}).join("")}
    <div style="height:20px"></div>
  </div>`;
}
function addMat(type,input){
  const f=input.files && input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image();
    img.onload=()=>{ const c=document.createElement("canvas");
      const scale=Math.min(1, 480/Math.max(img.width,img.height));
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      storeMat(type, c.toDataURL("image/jpeg",.72)); };
    img.src=rd.result; };
  rd.readAsDataURL(f);
}
function storeMat(type,dataUrl){
  if(!S.materials) S.materials={};
  if(!S.materials[type]) S.materials[type]=[];
  S.materials[type].push(dataUrl);
  try{ save(); }catch(e){ S.materials[type].pop(); toast("空きが足りず保存できませんでした"); return; }
  toast("去年の資料を入れました"); materials();
}
function delMat(type,i){
  S.materials[type].splice(i,1); save(); materials();
}
async function doEnableLock(){
  const pin=document.getElementById("s_pin").value.trim();
  if(!/^\d{4,8}$/.test(pin)){ toast("4〜8桁の数字にしてください"); return; }
  await enableLock(pin); armIdle(); toast("ロックをかけました"); settings(); }
async function doDisableLock(){ await disableLock(); toast("ロックを解除しました"); settings(); }
function fillSample(){ S.garden="ひまわり保育園"; S.classes="ひよこ・りす・ぱんだ";
  S.ng="必ず,絶対,がんばれ"; S.principle="のびのびと、じぶんらしく。"; save(); settings(); toast("おためしデータを入れました"); }
function saveSettings(){
  S.garden=document.getElementById("s_garden").value.trim();
  S.classes=document.getElementById("s_classes").value.trim();
  S.ng=document.getElementById("s_ng").value.trim();
  S.principle=document.getElementById("s_principle").value.trim();
  save(); toast("保存しました"); cur? result() : home(); }

/* ============ boot ============ */
if(localStorage.getItem(ENC_KEY)){ lockScreen(); } else { S=load(); home(); }
</script>
