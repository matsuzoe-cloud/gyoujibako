<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ぎょうじばこ</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#edf4f5">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ぎょうじばこ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#edf4f5; --walldeep:#e3ecee; --paper:#ffffff; --ink:#3d4a52; --sub:#94a3ab; --line:#eaeeef;
    --onwall:#3d4a52; --onwallsub:#7d8c94;
    --accent:#e26e88; --shu:#d64545; --green:#3fa878; --danger:#d9534f;
    --pshadow:0 1px 3px rgba(50,70,80,.10), 0 8px 20px rgba(50,70,80,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--walldeep);}
  body{color:var(--ink);font-size:15px;}
  button{cursor:pointer;border:none;font-family:inherit;color:inherit;background:none;font-size:inherit;}

  .phone{max-width:430px;margin:0 auto;background:var(--wall);min-height:100vh;display:flex;flex-direction:column;position:relative;}
  .screen{flex:1;padding-bottom:120px;}

  /* ---- 壁の上のバー ---- */
  .bar{position:sticky;top:0;z-index:5;background:var(--wall);
    display:flex;align-items:center;height:54px;padding:0 8px;}
  .bar .backb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--onwall);}
  .bar .title{flex:1;text-align:center;font-size:16px;font-weight:700;letter-spacing:1px;color:var(--onwall);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar .side{width:44px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--onwallsub);font-weight:700;}
  .bar .gearb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#90a0a8;}
  .bar .gearb svg{width:22px;height:22px;}
  .stepdots{display:flex;gap:5px;align-items:center;}
  .stepdots .sd{width:7px;height:7px;border-radius:50%;background:#d3dde1;}
  .stepdots .sd.done{background:rgba(226,110,136,.35);}
  .stepdots .sd.on{background:var(--accent);}

  /* ---- 紙 ---- */
  .paperpanel{background:var(--paper);border-radius:2px;box-shadow:var(--pshadow);margin:8px 16px 20px;position:relative;}
  .paperpanel .inner{padding:20px 18px;}

  /* ---- マスキングテープ ---- */
  .tape{position:absolute;top:-9px;left:50%;width:74px;height:20px;
    transform:translateX(-50%) rotate(-2deg);opacity:.85;border-radius:1px;
    box-shadow:0 1px 2px rgba(90,75,60,.15);}
  .tape.t2{transform:translateX(-50%) rotate(1.5deg);}

  /* ---- 付箋(カウントダウン) ---- */
  .fusen{display:inline-block;background:#ffe9a0;padding:12px 18px 13px;margin:12px 0 4px 20px;
    transform:rotate(-1.6deg);box-shadow:0 2px 6px rgba(90,75,60,.22);position:relative;text-align:left;}
  .fusen .l{font-size:12px;font-weight:700;color:#7c6a3a;}
  .fusen .n{font-size:20px;font-weight:900;color:#5c4a1e;margin-top:2px;font-variant-numeric:tabular-nums;}
  .fusen .n b{font-size:26px;color:var(--shu);}

  /* ---- 壁の紙グリッド ---- */
  .wall{display:grid;grid-template-columns:repeat(auto-fill, 170px);gap:30px 16px;justify-content:center;padding:24px 12px 10px;}
  .wallitem{width:170px;}
  .evpaper{width:170px;height:240px;background:var(--paper);box-shadow:var(--pshadow);position:relative;
    display:block;transform:rotate(var(--r,0deg));transition:transform .15s;}
  .evpaper:active{transform:rotate(var(--r,0deg)) scale(.97);}
  .evpaper .pin-thumb{width:390px;transform:scale(0.4359);transform-origin:top left;display:block;pointer-events:none;}
  .evpaper .blank{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:3px;padding:12px;}
  .evpaper .blank img{width:104px;height:104px;object-fit:contain;margin-bottom:2px;}
  .evpaper .bmon{font-family:"Zen Maru Gothic",sans-serif;font-size:16px;font-weight:900;color:#b9c8ce;}
  .evpaper .bname{font-size:15px;font-weight:700;color:var(--ink);}
  .evpaper .bcta{font-size:13px;font-weight:700;color:var(--accent);margin-top:6px;}
  .evpaper .stamp{position:absolute;right:8px;top:10px;}
  .plabel{text-align:center;font-size:11px;font-weight:700;color:var(--onwallsub);margin-top:10px;letter-spacing:.5px;}

  /* ---- はんこ ---- */
  .stamp{display:inline-flex;align-items:center;justify-content:center;flex:none;
    border:2px solid var(--shu);color:var(--shu);border-radius:50%;font-weight:700;
    transform:rotate(-8deg);background:rgba(255,255,255,.85);}
  .stamp-sm{width:30px;height:30px;font-size:13px;}
  .stamp-md{width:52px;height:52px;font-size:21px;border-width:2.5px;}
  .stamp-lg{width:88px;height:88px;font-size:34px;border-width:3px;}
  .stamped{animation:stampin .3s cubic-bezier(.2,1.5,.4,1) both;}
  @keyframes stampin{from{transform:rotate(-24deg) scale(1.9);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
  .stampbtn{width:96px;height:96px;border-radius:50%;border:3px solid var(--shu);color:var(--shu);
    background:var(--paper);font-size:36px;font-weight:700;display:flex;align-items:center;justify-content:center;
    transform:rotate(-8deg);box-shadow:0 2px 8px rgba(214,69,69,.2);margin:0 auto;}
  .stampbtn:active{transform:rotate(-8deg) scale(.9);}
  .stampcap{text-align:center;font-size:13px;color:var(--sub);margin-top:10px;font-weight:700;}

  /* ---- 紙の上の部品 ---- */
  .slabel{font-size:12px;font-weight:700;color:var(--onwallsub);padding:18px 20px 8px;letter-spacing:.5px;}
  .rows .row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:13px 4px;
    border-bottom:1px solid var(--line);text-align:left;font-size:15px;}
  .rows .row:last-child{border-bottom:none;}
  .row .txt{flex:1;line-height:1.5;}
  .row .sub{display:block;font-size:12px;color:var(--sub);margin-top:2px;font-weight:700;}
  .row .side{font-size:13px;color:var(--sub);flex:none;font-weight:700;}
  .row .chev{color:#cfc4b3;font-size:17px;flex:none;}
  .row:active{opacity:.55;}

  h2.q{font-size:19px;font-weight:900;line-height:1.5;margin-bottom:14px;}
  label.f{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:18px 0 2px;}
  input[type=date],input[type=text],input[type=password],textarea{width:100%;padding:12px 0;border:none;border-bottom:2px solid var(--line);
    border-radius:0;font-size:16px;font-family:inherit;background:transparent;color:var(--ink);}
  textarea{min-height:72px;line-height:1.7;resize:none;}
  input:focus,textarea:focus{outline:none;border-bottom-color:var(--accent);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .chip{padding:9px 14px;border-radius:6px;background:#eef3f5;font-size:14px;color:#6b7b83;font-weight:700;font-variant-numeric:tabular-nums;}
  .chip.sel{background:var(--accent);color:#fff;}

  .ctabar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:10;
    background:linear-gradient(transparent, var(--wall) 45%);
    padding:18px 16px calc(14px + env(safe-area-inset-bottom));}
  .btn-p{display:block;width:100%;padding:14px;border-radius:8px;background:var(--accent);color:#fff;
    font-size:15px;font-weight:700;text-align:center;box-shadow:0 3px 10px rgba(226,110,136,.3);}
  .btn-p:disabled{background:#d8cec2;box-shadow:none;}
  .btn-p:active{opacity:.85;}
  .btn-o{display:block;width:100%;padding:13px;border-radius:8px;border:1.5px solid #ccd8dc;background:#fff;
    font-size:14px;font-weight:700;text-align:center;color:var(--onwall);}
  .paperpanel .btn-o{border-color:var(--line);background:transparent;color:var(--ink);}

  .fab{position:fixed;bottom:26px;right:18px;width:58px;height:58px;border-radius:50%;
    background:var(--accent);color:#fff;font-size:27px;font-weight:700;z-index:15;
    box-shadow:0 5px 16px rgba(226,110,136,.5);display:flex;align-items:center;justify-content:center;}
  .fab:active{transform:scale(.93);}
  @media(min-width:431px){.fab{right:calc(50vw - 197px);}}
  @media(min-width:880px){.fab{right:calc(50vw - 412px);}}

  /* ---- loading ---- */
  .loading{display:flex;flex-direction:column;align-items:center;padding:90px 30px;gap:22px;}
  .mascot{animation:bob 1.7s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .loading .msg{font-size:14px;color:var(--onwallsub);text-align:center;line-height:2;font-weight:700;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---- おたより紙・チェック ---- */
  .paper{background:var(--paper);border-radius:2px;padding:24px 20px;box-shadow:var(--pshadow);
    line-height:2.05;font-size:14px;white-space:pre-wrap;position:relative;margin:0 16px;}
  .paperwrap{position:relative;}
  .paperwrap .stamp-md{position:absolute;top:12px;right:26px;z-index:2;}
  .editnote{font-size:12px;color:var(--onwallsub);padding:8px 20px 0;font-weight:700;}
  .checkrow{display:flex;gap:8px;padding:8px 20px;font-size:14px;line-height:1.6;color:#5b6b73;font-weight:700;}
  .checkrow .m{flex:none;color:var(--green);}
  .checkrow.ng{color:var(--danger);} .checkrow.ng .m{color:var(--danger);}

  /* ---- ポスター ---- */
  .posterbox{padding:0 16px;position:relative;}
  .poster{width:100%;aspect-ratio:210/297;overflow:hidden;position:relative;border-radius:2px;
    box-shadow:var(--pshadow);display:flex;flex-direction:column;align-items:center;text-align:center;}
  .poster *{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;}
  .poster .garland{position:absolute;top:0;left:0;right:0;}
  .poster .confetti{position:absolute;border-radius:50%;opacity:.5;}
  .poster .body{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;width:100%;padding:14% 9% 16%;}
  .poster h3{font-size:32px;font-weight:900;line-height:1.25;letter-spacing:2px;}
  .poster .p-art{width:44%;max-width:160px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.12));}
  .mascot-img{width:112px;height:112px;object-fit:contain;}
  .poster .p-datebox{margin-top:14px;background:rgba(255,255,255,.92);border-radius:14px;padding:9px 20px;box-shadow:0 3px 8px rgba(0,0,0,.08);}
  .poster .p-date{font-size:16px;font-weight:900;}
  .poster .p-time{font-size:12px;font-weight:700;color:#8a8078;}
  .poster .p-place{margin-top:9px;font-size:12px;font-weight:700;background:rgba(255,255,255,.75);padding:4px 14px;border-radius:999px;}
  .poster .p-garden{position:absolute;bottom:4.5%;left:50%;transform:translateX(-50%);z-index:2;
    font-size:11px;font-weight:900;background:rgba(255,255,255,.9);padding:5px 16px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.08);white-space:nowrap;}
  .photo-strip{position:relative;z-index:2;display:flex;justify-content:center;gap:12px;padding-top:12%;}
  .polaroid{width:60px;height:70px;background:#fff;border-radius:4px;box-shadow:0 3px 8px rgba(0,0,0,.14);padding:4px 4px 12px;}
  .polaroid .ph{width:100%;height:100%;background:#f1e8dc;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:20px;}
  .polaroid:nth-child(1){transform:rotate(-4deg);} .polaroid:nth-child(2){transform:rotate(3deg);} .polaroid:nth-child(3){transform:rotate(-2deg);}

  /* ---- sheet ---- */
  .sheet-bg{position:fixed;inset:0;background:rgba(74,66,56,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .15s ease;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:430px;background:var(--paper);border-radius:3px 3px 0 0;
    padding:6px 16px calc(20px + env(safe-area-inset-bottom));animation:sheetUp .22s ease-out both;
    box-shadow:0 -6px 24px rgba(0,0,0,.4);}
  @keyframes sheetUp{from{transform:translateY(40%)}to{transform:none}}
  .sheet .grab{width:36px;height:4px;border-radius:2px;background:#ccd8dc;margin:8px auto 6px;}
  .sheet .sh{font-weight:700;font-size:15px;padding:8px 4px 6px;color:var(--ink);}

  /* ---- principal / done ---- */
  .p-note{background:#ffe9a0;color:#6c5a28;font-size:13px;font-weight:700;padding:10px 20px;}
  .bigtext .paper{font-size:16px;line-height:2.1;}
  .donehead{text-align:center;padding:30px 16px 6px;position:relative;}
  .donehead .t{font-size:17px;font-weight:700;margin-top:12px;color:var(--onwall);}
  .donehead .time{font-size:13px;color:var(--onwallsub);margin-top:4px;font-weight:700;}
  .dcf{position:absolute;border-radius:50%;opacity:.8;}
  .npbox{margin:8px 16px 0;border:1.5px dashed #b9d2de;border-radius:6px;padding:14px;text-align:center;background:#fff;}
  .npbox .code{font-size:24px;font-weight:700;letter-spacing:3px;color:#4a90d9;font-variant-numeric:tabular-nums;}
  .npbox .l{font-size:12px;color:var(--onwallsub);font-weight:700;}

  .lockwrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:70px 20px;}
  .lockt{font-weight:700;color:var(--onwall);}
  .lockerr{color:var(--danger);font-size:13px;font-weight:700;}
  .lockwrap input{text-align:center;font-size:22px;letter-spacing:6px;max-width:220px;color:var(--onwall);border-bottom-color:#ccd8dc;}
  .lockwrap .btn-p{max-width:220px;width:100%;}

  .foot{margin-top:32px;padding:0 20px 20px;font-size:12px;line-height:2;color:#a3b1b7;text-align:center;font-weight:700;}
  .emptywall{text-align:center;padding:26px 16px 0;}
  .emptywall .m{font-size:13px;color:var(--onwallsub);margin-top:10px;line-height:1.9;font-weight:700;}

  .toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:rgba(74,66,56,.94);color:#fff;
    padding:11px 20px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;white-space:nowrap;font-weight:700;}
  .toast.show{opacity:1;}

  @media(min-width:880px){
    .phone{max-width:860px;}
    .resultgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0 28px;align-items:start;padding-right:16px;}
    .resultgrid .colR{position:sticky;top:64px;}
    .ctabar .btn-p{max-width:420px;margin:0 auto;}
  }
  .resultgrid .colL{min-width:0;}

  @media print{
    body *{visibility:hidden;} #printArea,#printArea *{visibility:visible;}
    #printArea{position:absolute;inset:0;display:block;}
    #printArea .poster{box-shadow:none;border-radius:0;height:100vh;}
    #printArea .paper{box-shadow:none;font-size:16px;margin:0;}
    .stamp{display:none;}
  }
  #printArea{display:none;}
</style>
</head>
<body>
<div class="phone" id="phone"></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* ============ data ============ */
const APP_VER = "2026.8.20-b";
const EV = {
  undoukai:{name:"運動会", accent:"#f2762e", tape:"rgba(242,118,46,.45)", art:"art/usagi_undoukai.webp",
    bg:"linear-gradient(165deg,#aee1ff 0%,#e8f6ff 45%,#fff3c4 100%)", flags:["#f2762e","#6fa8dc","#f2b84b","#4fb586"], conf:["#f2762e","#6fa8dc","#f2b84b"]},
  natsumatsuri:{name:"夏祭り", accent:"#e05c6e", tape:"rgba(224,92,110,.42)", art:"art/usagi_natsu.webp",
    bg:"linear-gradient(165deg,#2c3e6b 0%,#7c5ba6 55%,#ff9d76 100%)", flags:["#ffd66e","#ff8fab","#7fd8be","#ffb347"], conf:["#ffd66e","#ff8fab","#ffffff"]},
  happyoukai:{name:"発表会", accent:"#8e6fd8", tape:"rgba(142,111,216,.4)", art:"art/usagi_happyou.webp",
    bg:"linear-gradient(165deg,#e8e0ff 0%,#f6efff 50%,#ffe9f2 100%)", flags:["#8e6fd8","#f76e92","#f2b84b","#6fa8dc"], conf:["#8e6fd8","#f76e92","#f2b84b"]},
  sotsuen:{name:"卒園式", accent:"#e0699a", tape:"rgba(224,105,154,.4)", art:"art/usagi_sotsuen.webp",
    bg:"linear-gradient(165deg,#ffe9f0 0%,#fff6f0 55%,#e7f6ea 100%)", flags:["#e0699a","#f2b84b","#7fd8be","#f76e92"], conf:["#f9c8d8","#e0699a","#7fd8be"]}
};
const MOODS = {
  attaka:{label:"あたたかく", ex:"成長した姿を、楽しみにいらしてください"},
  teinei:{label:"きちんと", ex:"ぜひお越しくださいますよう、お願いいたします"},
  wakuwaku:{label:"わくわく", ex:"当日は、いっしょに楽しんでください！"}
};
const TIMES = ["9:00","9:30","10:00","15:30","16:00"];
const YEAR_ORDER=["natsumatsuri","undoukai","happyoukai","sotsuen"];
const MONTH={natsumatsuri:"7月",undoukai:"10月",happyoukai:"12月",sotsuen:"3月"};

let S = null;
function load(){ try{ const d=JSON.parse(localStorage.getItem("gyoujibako2")); if(d&&d.garden!==undefined) return d; }catch(e){}
  return {garden:"", classes:"", ng:"必ず,絶対,がんばれ", principle:"", events:[], seq:1, wip:null, materials:{}}; }

/* ---- 暗号化保存(アプリロック) ---- */
const ENC_KEY="gyoujibako2enc", PLAIN_KEY="gyoujibako2";
let cryptoKey=null, encSalt=null;
function b64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function unb64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function deriveKey(pin, saltBytes){
  const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:saltBytes, iterations:150000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]); }
async function saveEncrypted(){
  try{
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, cryptoKey, new TextEncoder().encode(JSON.stringify(S)));
    localStorage.setItem(ENC_KEY, JSON.stringify({salt:encSalt, iv:b64(iv), ct:b64(ct)}));
  }catch(e){ toast("保存できませんでした"); } }
function save(){ if(cryptoKey){ saveEncrypted(); } else localStorage.setItem(PLAIN_KEY, JSON.stringify(S)); }
async function enableLock(pin){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  encSalt=b64(salt); cryptoKey=await deriveKey(pin, salt);
  await saveEncrypted(); localStorage.removeItem(PLAIN_KEY); }
async function disableLock(){ cryptoKey=null; encSalt=null; localStorage.removeItem(ENC_KEY); save(); }
async function unlock(pin){
  try{
    const blob=JSON.parse(localStorage.getItem(ENC_KEY));
    const key=await deriveKey(pin, unb64(blob.salt));
    const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(blob.iv)}, key, unb64(blob.ct));
    S=JSON.parse(new TextDecoder().decode(pt));
    cryptoKey=key; encSalt=blob.salt; return true;
  }catch(e){ return false; } }
let idleTimer=null;
function armIdle(){ if(!cryptoKey) return; clearTimeout(idleTimer); idleTimer=setTimeout(()=>location.reload(), 5*60*1000); }
["click","keydown","input","touchstart"].forEach(ev=>document.addEventListener(ev, armIdle, {passive:true}));

function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function jpDate(iso){ if(!iso)return ""; const dt=new Date(iso+"T00:00:00");
  return `${dt.getMonth()+1}月${dt.getDate()}日（${"日月火水木金土"[dt.getDay()]}）`; }

let cur=null, startedAt=null;
const P=document.getElementById("phone");
const GEAR=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5c.04-.5.04-2.5 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2h-4l-.4 2.5a7.6 7.6 0 0 0-2.6 1.5l-2.4-1-2 3.4 2 1.6c-.04.5-.04 2.5 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5L10 22h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg>`;

function stepDots(n){ return `<div class="side"><div class="stepdots">
  ${[1,2,3,4].map(i=>`<span class="sd ${i<n?"done":i===n?"on":""}"></span>`).join("")}</div></div>`; }
function bar(opts){
  return `<div class="bar">
    ${opts.back?`<button class="backb" onclick="${opts.back}">‹</button>`:`<div style="width:44px"></div>`}
    <div class="title">${opts.title||""}</div>
    ${opts.right||`<div style="width:44px"></div>`}
  </div>`; }
function go(v,arg){
  if(cur && cur.type && !cur.letter && v!=="settings" && v!=="materials"){ S.wip=cur; save(); }
  ({home,pick,when,mood,photos,making,result,settings,principal,materials}[v])(arg); }
function matCount(type){ return ((S.materials||{})[type]||[]).length; }
function matTotal(){ return Object.values(S.materials||{}).reduce((a,l)=>a+l.length,0); }
function latestOf(type){
  const list=S.events.filter(e=>e.type===type);
  if(S.wip && S.wip.type===type && !S.events.find(e=>e.id===S.wip.id)) list.push(S.wip);
  if(!list.length) return null;
  return list.sort((a,b)=>b.id-a.id)[0];
}

/* ============ 壁(ホーム) ============ */
function fusenHtml(){
  const t=new Date(); t.setHours(0,0,0,0);
  const list=S.events.filter(e=>e.date && new Date(e.date+"T00:00:00")>=t).sort((a,b)=>a.date<b.date?-1:1);
  if(!list.length) return "";
  const e=list[0];
  const days=Math.round((new Date(e.date+"T00:00:00")-t)/86400000);
  return `<button class="fusen" onclick="resume(${e.id})">
    <div class="l">${EV[e.type].name} ${jpDate(e.date)}</div>
    <div class="n">${days===0?"きょう！":`あと <b>${days}</b> 日`}</div>
  </button>`;
}
function evPaperHtml(k){
  const d=EV[k], e=latestOf(k);
  const rot = {natsumatsuri:"-1deg",undoukai:"1.2deg",happyoukai:"-0.8deg",sotsuen:"0.9deg"}[k];
  const tapeCls = (k==="undoukai"||k==="sotsuen")? "tape t2":"tape";
  const mon = (e && e.date)? `${new Date(e.date+"T00:00:00").getMonth()+1}月` : MONTH[k];
  let inner, label;
  if(e && e.letter){
    inner = `<span class="pin-thumb">${posterHtml(e)}</span>
      ${e.status==="approved"?'<span class="stamp stamp-sm">済</span>':""}`;
    label = e.status==="approved"? `${mon}・できあがり` : e.status==="review"? `${mon}・園長先生の確認まち` : `${mon}・つくりかけ`;
  } else if(e){
    inner = `<span class="blank"><img src="${d.art}" alt=""><span class="bmon">${mon}</span><span class="bname">${d.name}</span><span class="bcta">つづきから</span></span>`;
    label = `${mon}・つくりかけ`;
  } else {
    inner = `<span class="blank"><img src="${d.art}" alt=""><span class="bmon">${mon}</span><span class="bname">${d.name}</span><span class="bcta">つくる</span></span>`;
    label = `${mon}・まだ`;
  }
  return `<div class="wallitem"><button class="evpaper" style="--r:${rot}" onclick="${e?`resume(${e.id})`:`startNewWith('${k}')`}">
    <span class="${tapeCls}" style="background:${d.tape}"></span>${inner}
  </button><div class="plabel">${label}</div></div>`;
}
function home(){
  cur=null;
  if(S.wip && !S.wip.type){ S.wip=null; save(); }
  P.innerHTML=`${bar({title:"ぎょうじばこ", right:`<button class="gearb" onclick="go('settings')">${GEAR}</button>`})}
  <div class="screen">
    ${fusenHtml()}
    ${S.events.length===0 && !S.wip?`<div class="emptywall"><img class="mascot mascot-img" src="art/usagi_base.webp" alt="">
      <div class="m">紙をえらんで、はじめてのおたよりを作ってみましょう。</div></div>`:""}
    <div class="wall">${YEAR_ORDER.map(k=>evPaperHtml(k)).join("")}</div>
  </div>
  <button class="fab" onclick="startNew()" aria-label="行事のおたよりをつくる">＋</button>`;
}
function startNew(){
  if(!S.garden){ go('settings'); toast("さいしょに園の名前を登録してください"); return; }
  cur={id:S.seq++, type:null, date:"", time:"10:00", mood:"attaka", photos:2,
       place:"園庭", status:"draft", letter:"", comment:"", minutes:0};
  startedAt=Date.now(); go('pick');
}
function startNewWith(type){
  if(!S.garden){ go('settings'); toast("さいしょに園の名前を登録してください"); return; }
  cur={id:S.seq++, type, date:"", time:"10:00", mood:"attaka", photos:2,
       place:"園庭", status:"draft", letter:"", comment:"", minutes:0};
  startedAt=Date.now(); go('when');
}
function resume(id){
  cur=S.events.find(e=>e.id===id) || (S.wip&&S.wip.id===id? S.wip:null);
  if(!cur)return; startedAt=Date.now()-(cur.minutes||0)*60000;
  if(cur.letter){ result(); return; }
  cur.type? (cur.date? go('mood') : go('when')) : go('pick'); }

/* ============ making ============ */
function making(){
  const d=EV[cur.type];
  const n=matCount(cur.type);
  P.innerHTML=`${bar({title:d.name})}
  <div class="screen"><div class="loading">
    <img class="mascot mascot-img" src="${d.art}" alt="">
    <div class="msg" id="loadMsg">${n?`去年の資料（${n}枚）を確認しています`:`去年の${d.name}の資料を確認しています`}</div>
  </div></div>`;
  setTimeout(()=>{ const m=document.getElementById("loadMsg"); if(m)m.textContent="今年の日付に直しています"; },800);
  setTimeout(()=>{ const m=document.getElementById("loadMsg"); if(m)m.textContent="ことばを見直しています"; },1500);
  setTimeout(()=>{ cur.letter=buildLetter();
    if(!S.events.find(e=>e.id===cur.id)) S.events.push(cur);
    cur.status="draft"; S.wip=null; save(); result(); },2100);
}
function buildLetter(){
  const d=EV[cur.type];
  const season={undoukai:"秋晴れが気持ちよい季節になりました",
    natsumatsuri:"せみの声がにぎやかな季節になりました",
    happyoukai:"木々の葉が色づく季節になりました",
    sotsuen:"春の日ざしがやわらかくなってきました"}[cur.type];
  const open={teinei:"日ごろより、園の活動にご協力いただきありがとうございます。",
    attaka:"いつもあたたかいご協力をありがとうございます。",
    wakuwaku:"子どもたちは、当日を楽しみにしています！"}[cur.mood];
  const close={teinei:"お忙しいところ恐れ入りますが、ぜひお越しください。",
    attaka:"子どもたちの成長した姿を、楽しみにいらしてください。",
    wakuwaku:"当日は、子どもたちと一緒に楽しんでください！"}[cur.mood];
  const kids={undoukai:"子どもたちは、かけっこやダンスの練習に元気いっぱいです。",
    natsumatsuri:"おみこしや盆おどりの練習をしています。お祭りの日が待ちきれない様子です。",
    happyoukai:"歌や合奏、劇あそびの練習をしています。友だちと力を合わせる楽しさを感じています。",
    sotsuen:"この一年で、ぐんと大きくなった子どもたち。園で過ごす残りの日々を大切にしています。"}[cur.type];
  const cls=S.classes? `\n【たいしょう】${S.classes} ぐみ`:"";
  return `保護者の皆様

${season}。${open}

${S.garden}の「${d.name}」を、下記のとおり行います。${kids}

【日にち】${jpDate(cur.date)} ${cur.time}〜
【ばしょ】${cur.place}${cls}

${close}

${S.garden}`;
}
function checks(){
  const out=[];
  out.push({ok:true, label:`${jpDate(cur.date)}。曜日は合っています`});
  const ngs=(S.ng||"").split(",").map(s=>s.trim()).filter(Boolean);
  const hit=ngs.filter(w=>cur.letter.includes(w));
  out.push(hit.length? {ok:false,label:`「${hit.join("、")}」が入っています。園では使わない言葉です`}
                     : {ok:true, label:`園で使わない言葉は入っていません`});
  out.push({ok:cur.letter.includes(cur.place), label: cur.letter.includes(cur.place)?"場所の書きもれはありません":"場所が書かれていません"});
  const n=matCount(cur.type);
  if(n) out.push({ok:true, label:`去年の資料 ${n}枚をもとにしています`});
  out.push({ok:true, label:"写真は外部に送っていません"});
  return out;
}

/* ============ poster ============ */
function garlandSvg(colors){
  const flags=Array.from({length:9},(_,i)=>{
    const x=i*46+8, c=colors[i%colors.length];
    return `<path d="M${x} 14 L${x+34} 14 L${x+17} 44 Z" fill="${c}"/>`;}).join("");
  return `<svg class="garland" viewBox="0 0 430 52" preserveAspectRatio="none">
    <path d="M0 10 Q215 26 430 10" stroke="rgba(255,255,255,.85)" stroke-width="3" fill="none"/>${flags}</svg>`;
}
function confettiDots(colors){
  const pos=[["12%","22%"],["85%","18%"],["8%","62%"],["90%","58%"],["16%","82%"],["82%","80%"],["50%","14%"]];
  return pos.map(([l,t],i)=>`<div class="confetti" style="left:${l};top:${t};width:${7+(i%3)*3}px;height:${7+(i%3)*3}px;background:${colors[i%colors.length]}"></div>`).join("");
}
function posterHtml(ev){
  const e=ev||cur;
  const d=EV[e.type];
  const dark = e.type==="natsumatsuri";
  const frames=e.photos>0?`<div class="photo-strip">${Array(+e.photos).fill(0).map(()=>`<div class="polaroid"><div class="ph">📷</div></div>`).join("")}</div>`:"";
  return `<div class="poster" style="background:${d.bg}">
    ${garlandSvg(d.flags)}${confettiDots(d.conf)}
    ${frames}
    <div class="body" style="${e.photos>0?"padding-top:2%":""}">
      <img class="p-art" src="${d.art}" alt="">
      <h3 style="${dark?"color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.15);":`color:${d.accent};text-shadow:0 3px 0 rgba(255,255,255,.7);`}">${d.name}</h3>
      <div class="p-datebox"><div class="p-date" style="color:${d.accent}">${jpDate(e.date)}</div>
        <div class="p-time">${e.time} スタート</div></div>
      <div class="p-place">ばしょ：${esc(e.place)}</div>
    </div>
    <div class="p-garden">${esc(S.garden)}</div>
  </div>`;
}

  </div></div>
  <div class="slabel">去年の資料</div>
  <div class="paperpanel"><div class="inner" style="padding:4px 18px"><div class="rows">
    <button class="row" onclick="go('materials')">
      <span class="txt">去年のおたより・ポスター<span class="sub">写真に撮って入れておくと、下書きのもとになります</span></span>
      <span class="side">${matTotal()?matTotal()+"枚":"なし"}</span><span class="chev">›</span></button>
  </div></div></div>
  <div class="slabel">アプリロック</div>
  ${cryptoKey?`<div class="paperpanel"><div class="inner" style="padding:4px 18px"><div class="rows"><button class="row" onclick="doDisableLock()">
      <span class="txt">ロックを解除する<span class="sub">暗号化をやめて、この端末にそのまま保存します</span></span><span class="chev">›</span></button></div></div></div>`
  :`<div class="paperpanel"><div class="inner">
    <label class="f">ロック番号（4〜8桁の数字）</label>
    <input type="password" id="s_pin" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="共用のパソコンで使うなら設定を">
    <div style="padding:12px 0 0"><button class="btn-o" onclick="doEnableLock()">ロックをかける（中身を暗号化して保存）</button></div>
    <div style="font-size:12px;color:var(--sub);padding-top:8px;line-height:1.9;font-weight:700">開くたびに番号が必要になります。5分さわらないと自動でロックされます。<br>⚠ 番号を忘れると中身は開けません。</div>
  </div></div>`}
  <div style="padding:4px 16px 0"><button class="btn-o" onclick="fillSample()">おためしデータを入れる</button></div>
  <div class="foot">とちゅうで呼ばれても、つづきから再開できます<br>
    お子さんの写真を外部に送ることはありません<br>
    保育士資格を持つ開発者が作っています<br><br>
    ばん ${APP_VER}</div>
  </div>
  <div class="ctabar"><button class="btn-p" onclick="saveSettings()">保存</button></div>`;
}
async function doEnableLock(){
  const pin=document.getElementById("s_pin").value.trim();
  if(!/^\d{4,8}$/.test(pin)){ toast("4〜8桁の数字にしてください"); return; }
  await enableLock(pin); armIdle(); toast("ロックをかけました"); settings(); }
async function doDisableLock(){ await disableLock(); toast("ロックを解除しました"); settings(); }
function fillSample(){ S.garden="ひまわり保育園"; S.classes="ひよこ・りす・ぱんだ";
  S.ng="必ず,絶対,がんばれ"; S.principle="のびのびと、じぶんらしく。"; save(); settings(); toast("おためしデータを入れました"); }
function saveSettings(){
  S.garden=document.getElementById("s_garden").value.trim();
  S.classes=document.getElementById("s_classes").value.trim();
  S.ng=document.getElementById("s_ng").value.trim();
  S.principle=document.getElementById("s_principle").value.trim();
  save(); toast("保存しました"); cur? result() : home(); }

/* ============ 去年の資料 ============ */
function materials(){
  P.innerHTML=`${bar({back:"settings()", title:"去年の資料"})}
  <div class="screen">
    <div class="slabel" style="line-height:1.9">去年のおたよりやポスターを、写真に撮って入れておく場所です。ここに入れたものをもとに、今年の下書きを作ります。写真は この端末の中にだけ保存されます。</div>
    ${YEAR_ORDER.map(k=>{
      const d=EV[k];
      const list=(S.materials||{})[k]||[];
      return `<div class="slabel">${MONTH[k]} ${d.name}</div>
      <div class="paperpanel"><div class="inner" style="padding:4px 18px"><div class="rows">
        ${list.map((m,i)=>`<div class="row">
          <img src="${m}" style="width:44px;height:44px;object-fit:cover;border-radius:4px;flex:none">
          <span class="txt">去年の${d.name} ${i+1}</span>
          <button class="side" style="color:var(--danger)" onclick="delMat('${k}',${i})">削除</button></div>`).join("")}
        <button class="row" onclick="document.getElementById('mat_${k}').click()">
          <span class="txt" style="color:var(--accent);font-weight:700">＋ 写真を追加</span></button>
        <input type="file" id="mat_${k}" accept="image/*" style="display:none" onchange="addMat('${k}',this)">
      </div></div></div>`;}).join("")}
    <div style="height:20px"></div>
  </div>`;
}
function addMat(type,input){
  const f=input.files && input.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const img=new Image();
    img.onload=()=>{ const c=document.createElement("canvas");
      const scale=Math.min(1, 480/Math.max(img.width,img.height));
      c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      storeMat(type, c.toDataURL("image/jpeg",.72)); };
    img.src=rd.result; };
  rd.readAsDataURL(f);
}
function storeMat(type,dataUrl){
  if(!S.materials) S.materials={};
  if(!S.materials[type]) S.materials[type]=[];
  S.materials[type].push(dataUrl);
  try{ save(); }catch(e){ S.materials[type].pop(); toast("空きが足りず保存できませんでした"); return; }
  toast("去年の資料を入れました"); materials();
}
function delMat(type,i){ S.materials[type].splice(i,1); save(); materials(); }

/* ============ lock ============ */
function lockScreen(msg){
  P.innerHTML=`${bar({title:"ぎょうじばこ"})}
  <div class="screen"><div class="lockwrap">
    <img class="mascot-img" src="art/usagi_base.webp" alt="">
    <div class="lockt">ロックがかかっています</div>
    <input type="password" id="pin" inputmode="numeric" maxlength="8" placeholder="ロック番号" autocomplete="off">
    <button class="btn-p" onclick="tryUnlock()">あける</button>
    ${msg?`<div class="lockerr">${msg}</div>`:""}
  </div></div>`;
  const el=document.getElementById("pin"); el.focus();
  el.addEventListener("keydown",e=>{ if(e.key==="Enter") tryUnlock(); }); }
async function tryUnlock(){
  const ok=await unlock(document.getElementById("pin").value.trim());
  if(ok){ armIdle(); home(); } else lockScreen("番号がちがいます"); }

/* ============ boot ============ */
if(localStorage.getItem(ENC_KEY)){ lockScreen(); } else { S=load(); home(); }
</script>
